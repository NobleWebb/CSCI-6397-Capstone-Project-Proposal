# render.yaml — Render Infrastructure-as-Code blueprint
# Deploy: https://render.com/deploy?repo=https://github.com/NobleWebb/CSCI-6397-Capstone-Project-Proposal

databases:
  - name: compliance-tracker-db
    plan: free
    databaseName: compliance_tracker
    user: compliance_user

services:
  - type: web
    name: compliance-tracker
    plan: free
    runtime: node
    rootDir: compliance-tracker/backend
    buildCommand: npm install && node src/database/seed.js
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: compliance-tracker-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 24h
      - key: FRONTEND_URL
        value: https://compliance-tracker.onrender.com
