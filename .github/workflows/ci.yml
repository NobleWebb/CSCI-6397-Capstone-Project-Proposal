# .github/workflows/ci.yml — CI/CD Pipeline
# Runs on every push and PR to main:
#   1. Lint the codebase
#   2. Run unit tests with coverage
#   3. Auto-deploy to Render (on push to main only)

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: compliance-tracker/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: compliance-tracker/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint --if-present
        continue-on-error: true

      - name: Run tests with coverage
        run: npm test
        env:
          NODE_ENV: test

  deploy:
    name: Deploy to Render
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render deploy
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            curl -s "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
            echo "Deploy triggered on Render."
          else
            echo "RENDER_DEPLOY_HOOK_URL not set — skipping deploy trigger."
            echo "Render auto-deploys from GitHub on push to main."
          fi
